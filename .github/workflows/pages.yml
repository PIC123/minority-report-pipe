name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/portal-wall-webcam-gestures-r7pb1e]   # feature-branch deploy while the camera work is reviewed; drop before merge
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # creates the Pages site on first run (otherwise enable Pages → Source: GitHub Actions by hand)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
